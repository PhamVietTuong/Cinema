<div class="page-header">
  <div class="page-header-inner">
    <div class="header-top">
      <div>
        <h1 class="page-title">{{ title | translate }}</h1>
        <p class="page-sub">{{ 'movies.list.subtitle' | translate }}</p>
      </div>
      <mat-form-field appearance="outline" class="search-box">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [formControl]="searchCtrl" [placeholder]="'movies.list.searchPlaceholder' | translate">
      </mat-form-field>
    </div>

    <div class="filter-row">
      <mat-button-toggle-group class="tabs" [value]="mode" (change)="setMode($event.value)">
        <mat-button-toggle *ngFor="let t of tabs" class="tab" [value]="t.mode">{{ t.label | translate }}</mat-button-toggle>
      </mat-button-toggle-group>
      <mat-form-field appearance="outline" *ngIf="!isPaged && genres.length">
        <mat-select [(ngModel)]="selectedGenre">
          <mat-option value="">{{ 'movies.filters.genre' | translate }}</mat-option>
          <mat-option *ngFor="let g of genres" [value]="g">{{ g }}</mat-option>
        </mat-select>
      </mat-form-field>
      <mat-form-field appearance="outline" *ngIf="!isPaged && languages.length">
        <mat-select [(ngModel)]="selectedLanguage">
          <mat-option value="">{{ 'movies.filters.language' | translate }}</mat-option>
          <mat-option *ngFor="let l of languages" [value]="l">{{ l }}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>
</div>

<div class="movies-page">
  <div *ngIf="loading$ | async" class="spinner-wrap">
    <mat-spinner diameter="40"></mat-spinner>
  </div>

  <div class="movie-grid">
    <app-movie-card *ngFor="let movie of displayed" [movie]="movie"></app-movie-card>
  </div>

  <div *ngIf="displayed.length === 0 && !(loading$ | async)" class="empty">
    <mat-icon>movie</mat-icon>
    <p>{{ 'movies.list.empty' | translate }}</p>
  </div>

  <div class="pager" *ngIf="isPaged && total > pageSize">
    <mat-paginator [length]="total" [pageSize]="pageSize" (page)="onPageChange($event)" showFirstLastButtons></mat-paginator>
  </div>
</div>

<app-site-footer></app-site-footer>
